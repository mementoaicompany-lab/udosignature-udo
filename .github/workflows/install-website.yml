name: Verify independent brand website
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'mementoaicompany-lab/udosignature-udo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check static site
        run: |
          python3 build.py
          python3 scripts/check.py
          for script in assets/*.js; do node --check "$script"; done
          if [ -f scripts/check-ferry.cjs ]; then node scripts/check-ferry.cjs; fi
          git diff --exit-code -- docs
