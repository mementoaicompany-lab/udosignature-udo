name: Publish reviewed September redesign
on:
  push:
    paths: ['.github/workflows/install-website.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'mementoaicompany-lab/udosignature-udo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact reviewed website package
        run: |
          python3 - <<'PYCODE'
          import hashlib,zipfile,pathlib,shutil
          p=pathlib.Path('website-package.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '613063a7bcd5ea3c4ec9007c83b86b3beaeb701ffdddf64eae23ce2ceab25a3e'
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  q=pathlib.PurePosixPath(name)
                  assert not q.is_absolute() and '..' not in q.parts
                  assert not any(x in q.parts for x in ['.git','.github','.openai'])
              for name in ['docs','assets','src','scripts','content']:
                  if pathlib.Path(name).exists(): shutil.rmtree(name)
              z.extractall('.')
          p.unlink()
          PYCODE
          python3 build.py
          python3 scripts/check.py
          for script in assets/*.js; do node --check "$script"; done
          if [ -f scripts/check-ferry.cjs ]; then node scripts/check-ferry.cjs; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          git commit -m 'Publish reviewed September redesign for udosignature-udo'
          git push origin HEAD:main
